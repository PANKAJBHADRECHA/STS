name: Controller and browser verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce all five policies and scenario families
        run: python -m sts_lab evaluate --output reports
      - name: Install browser QA tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser matrix and mobile layout
        run: python scripts/browser_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: controller-evaluation
          path: reports/
