[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-reliability-lab"
version = "0.1.0"
description = "Reproducible experiments for interruption-safe speech-agent systems"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sts-lab = "sts_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["sts_lab*"]
